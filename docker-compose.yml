  admin-server:
    build: ./admin-server
    container_name: admin-server
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - EUREKA_HOST=eureka-server
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  inkwell-web:
    build: ./inkwell-web
    container_name: inkwell-web
    ports:
      - "9000:9000"
    environment:
      - EUREKA_HOST=eureka-server
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
