server:
  port: ${AUTH_SERVICE_PORT:8081}
  address: 0.0.0.0


# ✅ ADD these two:
internal:
  secret: ${INTERNAL_SECRET:change-me-in-env}

oauth2:
  redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:4200/oauth2/redirect}

initial:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

spring:
  application:
    name: auth-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inkwell_auth}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:default-google-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:default-google-secret}
            redirect-uri: ${GATEWAY_URL:http://localhost:8080}/login/oauth2/code/google
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID:default-github-id}
            client-secret: ${GITHUB_CLIENT_SECRET:default-github-secret}
            redirect-uri: ${GATEWAY_URL:http://localhost:8080}/login/oauth2/code/github
            scope:
              - user:email
              - read:user

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_HOST:localhost}:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_here_make_it_at_least_256_bits_long}
  expiration: ${JWT_EXPIRATION:86400000}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_PLACEHOLDER}
    secret: ${RAZORPAY_KEY_SECRET:PLACEHOLDER_SECRET}
