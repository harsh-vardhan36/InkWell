<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>InkWell - Discover Stories</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .navbar { background-color: #ffffff; border-bottom: 1px solid #dee2e6; }
        .post-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .post-card:hover { transform: translateY(-5px); }
        .hero { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; padding: 60px 0; border-radius: 20px; margin-bottom: 40px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">InkWell</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary text-white ms-lg-3" href="/register">Join Now</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="hero text-center">
            <h1 class="display-4 fw-bold">Unleash Your Voice</h1>
            <p class="lead">Share your stories with the world on the most elegant blogging platform.</p>
        </div>

        <div class="row">
            <div class="col-md-8">
                <h3 class="mb-4">Recent Stories</h3>
                <div th:each="post : ${posts}" class="post-card p-4 mb-4">
                    <h2 th:text="${post.title}" class="h4 fw-bold">Post Title</h2>
                    <p th:text="${post.excerpt}" class="text-muted">Excerpt goes here...</p>
                    <div class="d-flex align-items-center">
                        <span th:text="${post.readTime} + ' min read'" class="badge bg-light text-dark">5 min read</span>
                        <a th:href="'/post/' + ${post.slug}" class="ms-auto text-decoration-none">Read more →</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 border-0 shadow-sm">
                    <h5>Subscribe to Newsletter</h5>
                    <form action="/newsletter/subscribe" method="post">
                        <input type="email" name="email" class="form-control mb-2" placeholder="Email Address">
                        <button class="btn btn-dark w-100">Subscribe</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
